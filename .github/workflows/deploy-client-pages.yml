name: deploy-client-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build web client
        working-directory: examples/client
        env:
          NET_WEB_HTTP_BASE: ${{ vars.NET_WEB_HTTP_BASE }}
          NET_WEB_WEBRTC_ADDR: ${{ vars.NET_WEB_WEBRTC_ADDR }}
        run: |
          PUBLIC_URL="/${{ github.event.repository.name }}/"
          trunk build --release --public-url "${PUBLIC_URL}"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
