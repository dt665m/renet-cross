[package]
name = "renet-cross"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "renet udp / webrtc cross support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dt665m/renet-cross"

[workspace]
members = ["crates/bevy-net-debug", "examples/shared", "examples/server", "examples/client"]
resolver = "2"

[features]
default = ["native-sync", "native-async"]
axum = ["dep:axum"]
native-sync = [
  "dep:reqwest",
  "reqwest/blocking",
  "reqwest/default-tls",
  "reqwest/json",
]
native-async = ["dep:reqwest", "reqwest/default-tls", "reqwest/json"]

[dependencies]
axum = { version = "0.8.8", optional = true }
log = "0.4.22"
renet = "2.0.0"
renetcode = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.2", default-features = false, optional = true }
str0m = "0.23.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Not imported directly: enables the `js` backend for the transitive
# getrandom 0.2 pulled in via renetcode -> chacha20poly1305 -> rand_core,
# which otherwise fails to build for wasm32-unknown-unknown.
getrandom = { version = "0.2.17", features = ["js"] }
gloo-net = { version = "0.7.0", features = ["http"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = [
  "Window",
  "Performance",
  "Event",
  "MessageEvent",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcDataChannelState",
  "RtcConfiguration",
  "RtcIceGatheringState",
  "RtcIceServer",
  "RtcPeerConnection",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
] }

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }

# Development builds use the reviewed SCTP correction. Downstream applications
# must repeat this override at their own workspace root; see README.md.
[patch.crates-io.sctp-proto]
git = "https://github.com/dt665m/sctp-proto.git"
rev = "cb94f37991c185fb9cc2fd41fbe92965e2a1f713"
