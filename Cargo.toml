[package]
name = "renet-cross"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["examples/shared", "examples/server", "examples/client"]
resolver = "2"

[features]
default = ["native-sync", "native-async"]
axum = ["dep:axum"]
native-sync = ["dep:reqwest", "reqwest/blocking", "reqwest/default-tls", "reqwest/json"]
native-async = ["dep:reqwest", "reqwest/default-tls", "reqwest/json"]

[dependencies]
axum = { version = "0.8.8", optional = true }
log = "0.4.22"
renet = "2.0.0"
renetcode = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.2", default-features = false, optional = true }
str0m = "0.16.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3.31"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
gloo-net = { version = "0.6.0", features = ["http"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = [
  "Event",
  "MessageEvent",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcDataChannelState",
  "RtcConfiguration",
  "RtcIceGatheringState",
  "RtcIceServer",
  "RtcPeerConnection",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
] }

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
